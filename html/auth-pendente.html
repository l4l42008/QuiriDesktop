<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <!-- ajusta a pagina pra telas menores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiri — Cadastro realizado</title>

    <!-- carrega as fontes usadas na pagina -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Montserrat:wght@500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- carrega os icones -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* define as cores usadas na pagina */
        :root{
            --cream:#f9e9d2;
            --cream-soft:#fdf3e6;
            --dark:#282828;
            --dark-soft:#3a3a3a;
            --green:#18482d;
            --green-deep:#103420;
            --green-mid:#456854;
            --green-light:#7b947a;
        }

        /* reseta espacamentos padrao dos elementos */
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        /* organiza o conteudo principal no centro da tela */
        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:var(--cream);
            font-family:'Montserrat',sans-serif;
            color:var(--dark);
            padding:40px 20px;
        }

        /* define o tamanho e organiza os elementos do cartao */
        .card{
            width:100%;
            max-width:380px;
            display:flex;
            flex-direction:column;
            align-items:center;
            text-align:center;
        }

        /* define o tamanho e o espacamento da logo */
        .logo{
            width:190px;
            height:auto;
            display:block;
            margin:0 auto 30px;
        }

        /* estiliza o texto abaixo da logo */
        .tagline{
            font-family:'Caveat',cursive;
            font-weight:600;
            font-size:1.55rem;
            color:var(--green-mid);
            text-align:center;
            margin-bottom:34px;
            letter-spacing:.01em;
        }

        /* estiliza o titulo da pagina */
        h2{
            color:var(--green);
            font-size:1.35rem;
            font-weight:800;
            letter-spacing:.03em;
            text-transform:uppercase;
            margin-bottom:12px;
        }

        /* estiliza a mensagem de cadastro realizado */
        .message{
            color:var(--green-mid);
            font-size:.78rem;
            line-height:1.7;
            max-width:330px;
            margin-bottom:20px;
        }

        /* cria a caixa q mostra o email cadastrado */
        .email-box{
            width:100%;
            padding:14px 16px;
            border-radius:8px;
            background:var(--dark);
            color:var(--cream-soft);
            font-family:'Montserrat',sans-serif;
            font-size:.7rem;
            font-weight:600;
            letter-spacing:.04em;
            word-break:break-word;
            margin-bottom:22px;
        }

        /* estiliza o botao de ir pro login */
        .btn-primary{
            width:100%;
            height:54px;
            border:none;
            border-radius:10px;
            background:var(--green);
            color:var(--cream-soft);
            font-family:'Montserrat',sans-serif;
            font-weight:800;
            font-size:.95rem;
            letter-spacing:.18em;
            text-transform:uppercase;
            cursor:pointer;
            transition:
                background .2s ease,
                transform .12s ease,
                box-shadow .2s ease;
        }

        /* muda o visual do botao qdo passa o mouse */
        .btn-primary:hover{
            background:var(--green-deep);
            transform:translateY(-1px);
            box-shadow:
                0 6px 16px -8px
                rgba(16,52,32,.6);
        }

        /* tira o movimento do botao qdo ele e clicado */
        .btn-primary:active{
            transform:translateY(0);
        }

        /* estiliza o texto de retorno */
        .back-text{
            margin-top:22px;
            font-size:.7rem;
            color:var(--green-mid);
            letter-spacing:.04em;
        }

        /* diminui alguns elementos em telas pequenas */
        @media (max-width:340px){
            .logo{width:160px;}
            .tagline{font-size:1.35rem;}
        }

        /* mostra um contorno qdo um elemento recebe foco pelo teclado */
        :focus-visible{outline:2px solid var(--green-mid);
                       outline-offset:2px;
        }
    </style>
</head>

<body>

    <!-- conteudo principal da pagina -->
    <main class="card">

        <!-- mostra a logo do quiri -->
        <img class="logo"
             src="../imagens/logoquiri.png"
             alt="logo quiri">

        <!-- mostra o titulo de cadastro realizado -->
        <h2>
            Cadastro realizado!
        </h2>

        <!-- informa q a conta foi criada -->
        <p class="message">
            Sua conta de nutricionista foi criada com sucesso.
        </p>

        <!-- mostra o email usado no cadastro -->
        <p id="emailUsuario"
           class="email-box">
        </p>

        <!-- leva o usuario de volta pra tela de login -->
        <button class="btn-primary"
                onclick="irParaLogin()">
            Ir para o login
        </button>
    </main>
    <script>

        // pega o email enviado pela url
        const parametros =
            new URLSearchParams(
                window.location.search
            );

        // pega o valor do email
        const email =
            parametros.get("email");

        // verifica se foi encontrado um email
        if (email) {

            // coloca o email dentro da caixa
            document.getElementById(
                "emailUsuario"
            ).textContent =
                "E-MAIL CADASTRADO: " + email;

        } else {
            // esconde a caixa se nao tiver email
            document.getElementById(
                "emailUsuario"
            ).style.display =
                "none";
        }

        // volta pra tela de login
        function irParaLogin(){

            // muda a pagina atual pro login
            window.location.href =
                "login.html";
        }
    </script>
</body>
</html>
